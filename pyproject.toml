[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard"
version = "1.3.0"
description = "Credit card fraud detection with cost-based decisions, explanations and drift monitoring."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear and pyupgrade.
select = ["E", "F", "I", "B", "UP"]
